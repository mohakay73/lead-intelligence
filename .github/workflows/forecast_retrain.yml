name: Bi-Weekly Market Model Retraining & Forecast

on:
  schedule:
    # Runs on the 1st and 15th of every month at 22:00 UTC (23:00 / 00:00 Swedish time)
    - cron: '0 22 1,15 * *'
  workflow_dispatch: # Allows manual on-demand trigger from GitHub Actions tab

jobs:
  retrain-and-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Run Feature Engineering Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m analytics.feature_pipeline

      - name: 2. Retrain Time-Series Model & Update Forecasts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m analytics.forecast_engine

