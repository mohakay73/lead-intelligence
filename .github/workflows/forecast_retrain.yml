name: Bi-Weekly Market Model Retraining & Forecast

on:
  schedule:
    # Runs on the 1st and 15th of every month at 01:42 UTC (02:42 CET Swedish time)
    # Off-peak non-round minute to bypass GitHub Actions runner queue spikes
    - cron: '42 1 1,15 * *'
  workflow_dispatch: # Allows manual on-demand trigger from GitHub Actions tab

jobs:
  retrain-and-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Fetch Latest Macro Indicators (Riksbanken & KI)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m ingestion.macro_ingestion

      - name: 2. Run Feature Engineering Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m analytics.feature_pipeline

      - name: 3. Retrain Time-Series Model & Update Forecasts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m analytics.forecast_engine
