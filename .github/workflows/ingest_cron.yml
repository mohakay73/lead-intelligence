name: Scheduled Lead Ingestion

on:
  schedule:
    # Runs every weekday at 05:20 UTC (06:20 CET Swedish time, off-peak to avoid GitHub queue delays)
    - cron: '20 5 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOBTECH_API_KEY: ${{ secrets.JOBTECH_API_KEY }}
          BRAINVILLE_API_KEY: ${{ secrets.BRAINVILLE_API_KEY }}
        run: |
          python -m ingestion.pipeline
