name: Scheduled Lead Ingestion

on:
  schedule:
    # Runs Sunday evening at 20:35 UTC (21:35 CET) to ensure fresh data is ready for the Monday digest
    - cron: '35 20 * * 0'
    # Runs weekday nights at 00:35 UTC (01:35 CET) off-peak to bypass daytime queue delays
    - cron: '35 0 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOBTECH_API_KEY: ${{ secrets.JOBTECH_API_KEY }}
          BRAINVILLE_API_KEY: ${{ secrets.BRAINVILLE_API_KEY }}
        run: |
          python -m ingestion.pipeline
